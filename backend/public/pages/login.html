<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in · SpendWise</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E💸%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/app.css">
</head>
<body data-page="login">
<script src="/js/theme-boot.js"></script>

<div class="bg"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>

<nav id="nav"></nav>

<main class="auth-wrap">
  <div class="auth-card">
    <h1>Welcome back</h1>
    <p class="lead">Log in to see your budget.</p>
    <form id="form" class="stack" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="username" required autofocus>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
      </div>
      <p class="err" id="err" role="alert"></p>
      <button class="btn btn-primary" id="submit" type="submit">Log in</button>
    </form>
    <p class="alt" id="signupLine">New here? <a href="/register">Create an account</a></p>
  </div>
</main>

<div class="toast" id="toast"></div>
<script type="module" src="/js/layout.js"></script>
<script type="module" src="/js/pages/login.js"></script>
</body>
</html>
